<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1524"/>
      <stop offset="100%" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFB800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9100" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="crimsonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#B70914"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <polygon points="180,200 340,110 340,290" fill="url(#goldBeam)"/>
  <circle cx="160" cy="200" r="95" fill="none" stroke="#FFB800" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.3"/>
  <path d="M 215 130 A 85 85 0 1 0 215 270" fill="none" stroke="url(#goldLens)" stroke-width="18" stroke-linecap="round" filter="url(#goldGlow)"/>
  <circle cx="160" cy="200" r="48" fill="#131B2C" stroke="#2A3752" stroke-width="3"/>
  <polygon points="148,175 186,200 148,225" fill="url(#goldLens)" filter="url(#goldGlow)"/>
  <circle cx="110" cy="155" r="5" fill="#0E1524"/>
  <circle cx="85" cy="200" r="5" fill="#0E1524"/>
  <circle cx="110" cy="245" r="5" fill="#0E1524"/>
  <circle cx="215" cy="130" r="7" fill="url(#crimsonAccent)"/>
  <circle cx="215" cy="270" r="7" fill="url(#crimsonAccent)"/>
</svg>