<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <!-- Clean Crisp White Background -->
  <rect width="520" height="160" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Brand Wordmark in Deep Cinema Black (#0A0E1A) -->
  <g fill="#0A0E1A">
    <!-- C (Geometric Curved Letter) -->
    <path d="M 68 45 C 55 45, 42 56, 42 75 C 42 94, 55 105, 68 105 C 78 105, 85 99, 88 92 L 102 99 C 96 111, 84 120, 68 120 C 44 120, 24 102, 24 75 C 24 48, 44 30, 68 30 C 84 30, 96 39, 102 51 L 88 58 C 85 51, 78 45, 68 45 Z"/>

    <!-- I (Filmstrip Column with Sprocket Perforations) -->
    <g transform="translate(116, 32)">
      <!-- Main Column -->
      <rect x="0" y="0" width="22" height="86" rx="2" fill="#0A0E1A"/>
      <!-- Filmstrip Sprocket Holes (White cutouts) -->
      <rect x="4" y="6" width="14" height="8" rx="1.5" fill="#FFFFFF"/>
      <rect x="4" y="20" width="14" height="8" rx="1.5" fill="#FFFFFF"/>
      <rect x="4" y="34" width="14" height="8" rx="1.5" fill="#FFFFFF"/>
      <rect x="4" y="48" width="14" height="8" rx="1.5" fill="#FFFFFF"/>
      <rect x="4" y="62" width="14" height="8" rx="1.5" fill="#FFFFFF"/>
      <rect x="4" y="76" width="14" height="6" rx="1.5" fill="#FFFFFF"/>
    </g>

    <!-- N (Bold Sans) -->
    <path d="M 154 32 L 172 32 L 198 84 L 198 32 L 216 32 L 216 118 L 198 118 L 172 66 L 172 118 L 154 118 Z"/>

    <!-- E -->
    <path d="M 230 32 L 274 32 L 274 47 L 248 47 L 248 67 L 270 67 L 270 82 L 248 82 L 248 103 L 274 103 L 274 118 L 230 118 Z"/>

    <!-- M -->
    <path d="M 288 32 L 308 32 L 322 76 L 336 32 L 356 32 L 356 118 L 340 118 L 340 60 L 328 98 L 316 98 L 304 60 L 304 118 L 288 118 Z"/>

    <!-- A -->
    <path d="M 382 32 L 402 32 L 424 118 L 406 118 L 400 96 L 384 96 L 378 118 L 360 118 Z M 388 81 L 396 81 L 392 60 Z"/>

    <!-- T -->
    <path d="M 426 32 L 468 32 L 468 47 L 456 47 L 456 118 L 438 118 L 438 47 L 426 47 Z"/>
  </g>

  <!-- O (Vintage Cinema Film Reel Spool) -->
  <g transform="translate(488, 75)">
    <!-- Outer Reel Rim -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#0A0E1A" stroke-width="8"/>
    <!-- Outer Rim Track -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#0A0E1A" stroke-width="2"/>
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="13" fill="#0A0E1A"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    <!-- 5 Radial Spool Drive Holes -->
    <circle cx="0" cy="-21" r="5.5" fill="#0A0E1A"/>
    <circle cx="20" cy="-7" r="5.5" fill="#0A0E1A"/>
    <circle cx="12" cy="18" r="5.5" fill="#0A0E1A"/>
    <circle cx="-12" cy="18" r="5.5" fill="#0A0E1A"/>
    <circle cx="-20" cy="-7" r="5.5" fill="#0A0E1A"/>
  </g>

  <!-- Unspooling Film Ribbon flowing from Reel 'O' and looping beneath CINEMAT to 'I' -->
  <path d="M 488 113 C 440 128, 370 125, 300 131 C 230 137, 160 133, 126 118" 
        fill="none" stroke="#0A0E1A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Film Sprocket marks along the ribbon -->
  <line x1="160" y1="128" x2="160" y2="134" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="190" y1="129" x2="190" y2="135" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="220" y1="131" x2="220" y2="137" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="250" y1="130" x2="250" y2="136" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="280" y1="129" x2="280" y2="135" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="310" y1="128" x2="310" y2="134" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="340" y1="127" x2="340" y2="133" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="370" y1="126" x2="370" y2="132" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="400" y1="125" x2="400" y2="131" stroke="#0A0E1A" stroke-width="2"/>
  <line x1="430" y1="123" x2="430" y2="129" stroke="#0A0E1A" stroke-width="2"/>
</svg>
