<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B5C"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="24" fill="#090D16" stroke="#1E293B" stroke-width="2"/>

  <!-- Logo Mark Left -->
  <g transform="translate(50, 40)">
    <path d="M 100 25 A 55 55 0 1 0 100 135" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="65" cy="80" r="32" fill="#121A2C" stroke="#2A3752" stroke-width="2.5"/>
    <polygon points="58,63 83,80 58,97" fill="url(#goldGrad)"/>
    <circle cx="100" cy="25" r="5.5" fill="url(#redGrad)"/>
    <circle cx="100" cy="135" r="5.5" fill="url(#redGrad)"/>
  </g>

  <!-- Typography Right -->
  <text x="210" y="115" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="2" fill="#FFFFFF">
    CINEMA<tspan fill="url(#goldGrad)">TO</tspan>
  </text>
  <text x="215" y="155" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#94A3B8">
    WHERE BRANDS MEET THE BIG SCREEN
  </text>
  <rect x="215" y="172" width="40" height="3" rx="1.5" fill="url(#redGrad)"/>
</svg>